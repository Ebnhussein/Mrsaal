<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مرسال Scraper</title><link rel="stylesheet" href="panel.css"><script src="games.js" defer></script><script src="panel.js" defer></script></head><body>
<header><div><span class="brand">مرسال <small>SCRAPER</small></span><p data-ar="شركات وفرص، في حسابك." data-en="Companies and opportunities, in your account."></p></div><button id="language" class="quiet">EN</button></header>
<main>
<section><div class="eyebrow" data-ar="١ · حسابك" data-en="1 · YOUR ACCOUNT"></div><strong id="account" data-ar="الحساب غير مربوط" data-en="Account not connected"></strong><div class="actions"><button id="connect" data-ar="ربط حساب مرسال" data-en="Connect Mrsaal"></button><button id="open-app" class="quiet" data-ar="فتح مرسال" data-en="Open Mrsaal"></button></div></section>
<section><div class="eyebrow" data-ar="٢ · ابحث في مصر والخليج" data-en="2 · SEARCH EGYPT & THE GULF"></div>
<label for="query" data-ar="المجال أو المسمى الوظيفي" data-en="Industry or job title"></label><input id="query" maxlength="200" placeholder="مثال: Media Buyer" data-ar-placeholder="مثال: Media Buyer" data-en-placeholder="Example: Media Buyer">
<div class="columns"><div><label for="country" data-ar="الدولة" data-en="Country"></label><select id="country"><option value="EG" data-ar="مصر" data-en="Egypt"></option><option value="SA" data-ar="السعودية" data-en="Saudi Arabia"></option><option value="AE" data-ar="الإمارات" data-en="UAE"></option><option value="KW" data-ar="الكويت" data-en="Kuwait"></option><option value="QA" data-ar="قطر" data-en="Qatar"></option><option value="BH" data-ar="البحرين" data-en="Bahrain"></option><option value="OM" data-ar="عُمان" data-en="Oman"></option></select></div><div><label for="city" data-ar="المدينة (اختياري)" data-en="City (optional)"></label><input id="city" maxlength="100"></div></div>
<label for="work-mode" data-ar="شكل العمل" data-en="Work arrangement"></label><select id="work-mode"><option value="" data-ar="كل الأشكال" data-en="All arrangements"></option><option value="remote" data-ar="ريموت" data-en="Remote"></option><option value="hybrid" data-ar="هجين" data-en="Hybrid"></option><option value="onsite" data-ar="من مقر الشركة" data-en="On-site"></option></select>
<label for="domain" data-ar="موقع وظائف محدد (اختياري)" data-en="Job website domain (optional)"></label><input id="domain" dir="ltr" maxlength="200" placeholder="wuzzuf.net">
<div class="actions"><button id="search-jobs" data-ar="البحث عن وظائف" data-en="Find jobs"></button><button id="search-maps" class="quiet" data-ar="شركات على Maps" data-en="Companies on Maps"></button></div>
<p class="hint" data-ar="البحث يفتح النتائج؛ اختار الصفحة واضغط أيقونة مرسال عليها. ترشيح النتائج حسب الـCV يأتي في مرحلة لاحقة." data-en="Search opens results. Choose a page and click the Mrsaal toolbar icon there. CV-based ranking is a later phase."></p>
</section>
<section><div class="eyebrow" data-ar="٣ · اجمع من الصفحة المختارة" data-en="3 · COLLECT FROM YOUR CHOSEN PAGE"></div><p id="source" class="source"></p>
<p class="hint" data-ar="Maps، جداول الشركات، وصفحات الوظائف ببيانات JobPosting. للصفحات الأخرى حدد كروت النتائج أدناه." data-en="Maps, company tables and JobPosting pages. For other pages, specify the result cards below."></p>
<details><summary data-ar="تحديد الكروت يدويًا" data-en="Custom result cards"></summary><label for="selector" data-ar="CSS selector للكارت" data-en="Card CSS selector"></label><input id="selector" dir="ltr" maxlength="300" placeholder=".company-card"><label for="kind" data-ar="نوع الكروت" data-en="Card type"></label><select id="kind"><option value="company" data-ar="شركات" data-en="Companies"></option><option value="job" data-ar="وظائف" data-en="Jobs"></option></select></details>
<label for="limit" data-ar="أقصى عدد في الدفعة" data-en="Maximum per batch"></label><input id="limit" type="number" min="1" max="250" value="100">
<label class="check"><input id="auto-scroll" type="checkbox" checked><span data-ar="تحميل النتائج تلقائيًا حتى العدد المطلوب أو نهاية القائمة" data-en="Load more results until the limit or end of the list"></span></label>
<p class="notice" data-ar="البدء يضيف النتائج تلقائيًا للحساب الموضح فوق. الإضافة تجمع وتحفظ فقط؛ الإرسال والتقديم لهما مراجعة مستقلة داخل مرسال." data-en="Starting imports results into the account shown above. This extension only collects and saves; sending and applying have a separate review in Mrsaal."></p>
<div class="actions"><button id="collect" class="primary" data-ar="ابدأ الجمع والإضافة لحسابي" data-en="Collect and add to my account"></button><button id="retry-save" hidden data-ar="إعادة تأكيد حفظ الدفعة" data-en="Confirm pending save"></button><button id="stop" class="quiet" data-ar="إيقاف" data-en="Stop"></button></div>
</section>
<section id="activity" aria-busy="false"><div class="eyebrow" data-ar="نتيجة العملية" data-en="RESULT"></div><div class="activity-head"><span id="activity-icon" class="activity-icon" aria-hidden="true">✓</span><div><strong id="activity-title"></strong><p id="activity-stage" class="hint"></p></div></div>
<div class="scan-visual" aria-hidden="true"><i></i><span></span><span></span><span></span></div>
<div class="activity-stats"><div><strong id="live-count">0</strong><span data-ar="نتيجة مجمعة" data-en="results collected"></span></div><div><strong id="live-limit">100</strong><span data-ar="الحد المطلوب" data-en="batch limit"></span></div></div>
<div class="progress-track" role="progressbar" id="collection-progress" aria-label="Collection toward batch limit" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="progress-fill"></i></div>
<ol class="activity-steps"><li id="step-collect" data-ar="جمع النتائج" data-en="Collect"></li><li id="step-import" data-ar="حفظ في حسابك" data-en="Save to account"></li><li id="step-done" data-ar="تم" data-en="Done"></li></ol>
<p id="live-latest" class="hint"></p><p id="status" role="status"></p><details id="waiting-games" class="games"><summary data-ar="🎮 استراحة صغيرة أثناء الانتظار" data-en="🎮 A little break while waiting"></summary><p class="hint" data-ar="اللعبة لا توقف الجمع. استخدم الأسهم أو الأزرار، أو جرّب إكس أو." data-en="Collection continues while you play. Use arrow keys/buttons, or try tic-tac-toe."></p><select id="game-choice"><option value="snake" data-ar="التعبان" data-en="Snake"></option><option value="xo" data-ar="إكس أو" data-en="Tic-tac-toe"></option></select><div id="snake-game"><canvas id="snake-board" width="256" height="256" tabindex="0" aria-label="Snake game"></canvas><div class="actions"><button id="snake-start" data-ar="ابدأ / أعد اللعب" data-en="Start / restart"></button><button id="snake-pause" data-ar="وقفة" data-en="Pause"></button><span id="snake-score">0</span></div><div class="game-pad"><button data-direction="up">↑</button><button data-direction="left">←</button><button data-direction="down">↓</button><button data-direction="right">→</button></div></div><div id="xo-game" hidden><div id="xo-board"></div><button id="xo-reset" data-ar="جولة جديدة" data-en="New round"></button></div><p id="game-status" role="status"></p></details><div id="preview"></div></section>
<section><div class="actions"><strong data-ar="الفرص المحفوظة" data-en="Saved opportunities"></strong><button id="saved" class="quiet" data-ar="تحديث" data-en="Refresh"></button></div><button id="job-details" class="quiet" hidden data-ar="جمع تفاصيل أول 10 إعلانات" data-en="Collect details of first 10 postings"></button><p class="hint" data-ar="قد يطلب Chrome السماح لمواقع الإعلانات. لا يتم التقديم أو الإرسال." data-en="Chrome may ask for posting-site access. No applications are submitted."></p><div id="saved-jobs"></div></section>
</main><footer data-ar="العملية تعمل في متصفحك أثناء فتحه. قد تتطلب بعض المواقع معالجة خاصة أو تسجيل الدخول." data-en="Collection runs while your browser is open. Some websites need a dedicated adapter or sign-in."></footer>
</body></html>
