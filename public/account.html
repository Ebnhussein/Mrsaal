<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>حساب مرسال · Mrsaal account</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/assets/app.css"><link rel="stylesheet" href="/assets/launch.css"><link rel="stylesheet" href="/assets/account.css"><script src="/assets/theme-init.js"></script><script defer src="/assets/account.js"></script></head><body><main class="account-page card"><header class="account-header"><a class="account-brand" href="/ar/"><img src="/assets/favicon.svg" alt="" width="32" height="32">مرسال · Mrsaal</a><button id="account-language" type="button" class="btn btn-secondary">English</button></header><h1 id="account-title">حسابك في مرسال</h1><p id="account-description"></p><p id="account-status" role="status" aria-live="polite"></p><section id="account-waiting" hidden><div class="account-mail-icon" aria-hidden="true">✉</div><h2 id="account-waiting-title"></h2><p id="account-waiting-copy"></p><strong id="account-pending-email" dir="ltr"></strong><p id="account-spam-hint"></p><div id="account-resend-captcha"></div><button class="btn btn-primary" id="account-resend" type="button"></button><button class="btn btn-secondary" id="account-correct" type="button"></button><button class="btn btn-secondary" id="account-confirmed-login" type="button"></button></section><form id="account-form"><div id="account-name-group"><label for="account-name" id="name-label">الاسم</label><input class="input" id="account-name" autocomplete="name" minlength="2" maxlength="120"></div><div id="account-email-group"><label for="account-email" id="email-label">البريد الإلكتروني</label><input class="input" id="account-email" type="email" autocomplete="email" required dir="ltr" maxlength="254"></div><div id="account-phone-group"><label for="account-phone" id="phone-label">رقم الموبايل</label><input class="input" id="account-phone" type="tel" autocomplete="tel" dir="ltr" placeholder="+201012345678" maxlength="30"><small id="account-phone-hint"></small></div><div id="account-password-group"><label for="account-password" id="password-label">كلمة المرور</label><input class="input" id="account-password" type="password" autocomplete="current-password" minlength="8" maxlength="128" required></div><div id="account-confirm-password-group"><label for="account-confirm-password" id="confirm-password-label">تأكيد كلمة المرور</label><input class="input" id="account-confirm-password" type="password" autocomplete="new-password" minlength="8" maxlength="128"></div><label id="account-terms-group" class="account-terms"><input type="checkbox" id="account-terms"><span id="account-terms-copy"></span></label><div class="account-honeypot" aria-hidden="true"><label for="account-website">Website</label><input id="account-website" autocomplete="off" tabindex="-1"></div><div id="account-captcha"></div><button class="btn btn-primary" id="account-submit">دخول</button></form><nav class="launch-actions" id="account-navigation"><button class="btn btn-secondary" id="account-signin" type="button">دخول</button><button class="btn btn-secondary" id="account-signup" type="button">حساب جديد</button><button class="btn btn-secondary" id="account-forgot" type="button">نسيت كلمة المرور</button></nav><a class="btn btn-secondary account-google" id="account-google" href="/auth/google">متابعة باستخدام Google</a><footer><a id="account-privacy" href="/ar/privacy">الخصوصية</a> · <a id="account-legal" href="/ar/terms">الشروط</a></footer></main></body></html>
